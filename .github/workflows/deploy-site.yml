name: Deploy Finch documentation site

# Builds the landing page, Storybook (/storybook/) and every app in apps/examples/ into one
# GitHub Pages artifact (see scripts/build-site.mjs). Requires Settings -> Pages -> Source:
# "GitHub Actions".
#
# The deploy job is skipped on bluesky/finch, which still publishes Storybook alone to the
# gh-pages branch via publish-storybook.yml. Remove that guard (and retire publish-storybook.yml)
# only once the official site is ready to switch over.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/**/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build the complete site
        run: npm run build:site
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    if: github.repository != 'bluesky/finch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
